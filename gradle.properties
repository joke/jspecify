org.gradle.caching=true
org.gradle.configuration-cache=true
# org.gradle.unsafe.isolated-projects=true - blocked on info.solidsoft.pitest's PitestPlugin
# unconditionally reaching into the root project's buildscript from every project it's applied to
# (a legacy-migration guard with no config to disable). Re-enable once the pitest plugin fixes this
# upstream, or another workaround is found.
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.problems.report=true
